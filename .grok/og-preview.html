<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #141210; }
  body { font-family: "Liberation Sans", sans-serif; color: #1c1915; }
  .sheet {
    position: absolute;
    left: 56px; right: 56px; top: 48px; bottom: 48px;
    background: #f3efe6;
  }
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #1e3a5f; }
  .kicker {
    position: absolute; left: 72px; top: 54px;
    font-size: 18px; font-weight: 700; letter-spacing: 0.28em;
    text-transform: uppercase; color: #8a6232;
  }
  h1 {
    position: absolute; left: 68px; top: 92px; margin: 0;
    font-family: "Liberation Serif", "Bitstream Charter", serif;
    font-weight: 700; font-size: 168px; line-height: 0.9;
    letter-spacing: -0.035em; color: #1c1915;
  }
  .rule { position: absolute; left: 72px; top: 268px; width: 420px; height: 3px; background: #8a6232; }
  .rule2 { position: absolute; left: 72px; top: 276px; width: 420px; height: 1px; background: #1e3a5f; }
  .tag {
    position: absolute; left: 72px; top: 300px; margin: 0;
    font-family: "Liberation Serif", serif; font-style: italic;
    font-size: 36px; color: #5c564c;
  }
  .meta {
    position: absolute; left: 72px; bottom: 48px;
    font-size: 16px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: #7a7268;
  }
  .sleeve {
    position: absolute; right: 64px; bottom: 56px;
    width: 220px; height: 220px; background: #1c1915; color: #f3eee6;
  }
  .sleeve .s { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #e4c896; }
  .sleeve .cat {
    position: absolute; left: 24px; top: 22px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #e4c896;
  }
  .sleeve .name {
    position: absolute; left: 22px; right: 14px; bottom: 18px;
    font-family: "Liberation Serif", serif; font-size: 18px; line-height: 1.15;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="spine"></div>
    <div class="kicker">Private desk</div>
    <h1>CamOS</h1>
    <div class="rule"></div>
    <div class="rule2"></div>
    <p class="tag">The private desk</p>
    <div class="meta">Cam Leinad · Kampala</div>
    <div class="sleeve">
      <div class="s"></div>
      <div class="cat">CAM-001</div>
      <div class="name">Ride or Die<br>Is Who We Are</div>
    </div>
  </div>
</body>
</html>
