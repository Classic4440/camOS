<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #141210;
  }
  .desk { position: absolute; inset: 0; background: #141210; }
  .vinyl {
    position: absolute;
    left: 78px;
    top: 215px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #f3efe6 0 11px, #8a6232 12px 34px, #1c1915 35px 42px, #1e3a5f 43px 100%);
    box-shadow: inset 0 0 0 8px rgba(20, 18, 16, 0.35);
  }
  .vinyl::after {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%,
      transparent 0 7px,
      rgba(243, 239, 230, 0.16) 7px 8px);
  }
  .sheet {
    position: absolute;
    left: 168px;
    right: 92px;
    top: 48px;
    bottom: 48px;
    background: #f3efe6;
    box-shadow: 0 10px 28px rgba(20, 18, 16, 0.45);
  }
  .spine {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: #1e3a5f;
  }
  .rules {
    position: absolute;
    left: 36px;
    right: 36px;
    height: 92px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 27px,
      rgba(28, 25, 21, 0.13) 27px 28px
    );
  }
  .rules.top { top: 22px; }
  .rules.bottom { bottom: 22px; }
  .rule-brass {
    position: absolute;
    left: 36px;
    right: 148px;
    height: 2px;
    background: #8a6232;
  }
  .rule-brass.top { top: 124px; }
  .rule-brass.bottom { bottom: 124px; }
  .ruler {
    position: absolute;
    top: 28px;
    bottom: 28px;
    right: 36px;
    width: 22px;
    background: #8a6232;
  }
  .ruler i {
    position: absolute;
    left: 0;
    width: 10px;
    height: 1px;
    background: #1c1915;
  }
  .lockup {
    position: absolute;
    left: 70px;
    right: 90px;
    top: 176px;
    bottom: 176px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: "Bitstream Charter", "Liberation Serif", serif;
    font-weight: 700;
    font-size: 200px;
    line-height: 0.86;
    letter-spacing: -0.03em;
    color: #1c1915;
  }
  .tag {
    margin: 22px 0 0;
    font-family: "Bitstream Charter", "Liberation Serif", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 36px;
    letter-spacing: 0.01em;
    color: #8a6232;
  }
  .hair {
    width: 72px;
    height: 2px;
    margin-top: 18px;
    background: #1e3a5f;
  }
</style>
</head>
<body>
  <div class="desk">
    <div class="vinyl"></div>
    <div class="sheet">
      <div class="spine"></div>
      <div class="rules top"></div>
      <div class="rules bottom"></div>
      <div class="rule-brass top"></div>
      <div class="rule-brass bottom"></div>
      <div class="ruler">
        <i style="top:8%"></i><i style="top:16%"></i><i style="top:24%;width:16px"></i>
        <i style="top:32%"></i><i style="top:40%"></i><i style="top:48%;width:16px"></i>
        <i style="top:56%"></i><i style="top:64%"></i><i style="top:72%;width:16px"></i>
        <i style="top:80%"></i><i style="top:88%"></i>
      </div>
      <div class="lockup">
        <h1>CamOS</h1>
        <p class="tag">The private desk</p>
        <div class="hair"></div>
      </div>
    </div>
  </div>
</body>
</html>
