<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 264px; overflow: hidden; background: #141210; }
  body { font-family: "Liberation Sans", sans-serif; color: #f3efe6; }
  .sheet {
    position: absolute; left: 0; top: 0; bottom: 0; width: 760px; background: #f3efe6;
  }
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #1e3a5f; }
  .kicker {
    position: absolute; left: 48px; top: 36px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.26em;
    text-transform: uppercase; color: #8a6232;
  }
  h1 {
    position: absolute; left: 44px; top: 54px; margin: 0;
    font-family: "Liberation Serif", serif; font-weight: 700;
    font-size: 92px; line-height: 0.9; letter-spacing: -0.03em; color: #1c1915;
  }
  .tag {
    position: absolute; left: 48px; top: 156px; margin: 0;
    font-family: "Liberation Serif", serif; font-style: italic;
    font-size: 26px; color: #5c564c;
  }
  .sleeve {
    position: absolute; right: 56px; top: 36px; width: 168px; height: 168px; background: #1c1915;
  }
  .sleeve .s { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #e4c896; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="spine"></div>
    <div class="kicker">Private desk</div>
    <h1>CamOS</h1>
    <p class="tag">The private desk</p>
  </div>
  <div class="sleeve"><div class="s"></div></div>
</body>
</html>
